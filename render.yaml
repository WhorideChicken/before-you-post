services:
  - type: web
    name: before-you-post
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: MODEL_API_KEY  # standard mode (Meta Model API); leave empty to keep it off
        sync: false
      - key: OPEN_API_KEY  # private mode (Muse Spark Open on Baseten); leave empty to keep it off
        sync: false
      - key: RUNS_PER_HOUR
        value: "4"
      - key: RUNS_PER_DAY
        value: "30"
